# MongoDB Configuration File for Production

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# Storage
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      journalCompressor: snappy
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Logging
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Security
security:
  authorization: enabled

# Replication (uncomment for replica set)
# replication:
#   replSetName: "rs0"

# Sharding (uncomment for sharded cluster)
# sharding:
#   clusterRole: shardsvr

# Operation profiling
operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp

# Set parameters
setParameter:
  enableLocalhostAuthBypass: false