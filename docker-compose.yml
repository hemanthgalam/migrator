# Migrator plus sandbox databases to try the real connectors against.
#   docker compose up --build        -> console on http://localhost:3000
# Inside the console, use these hosts: postgres:5432, mysql:3306,
# mongodb://admin:adminpass@mongodb:27017 (database: migration_test).

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      WORKER_CONCURRENCY: 4
    volumes:
      - migrator_data:/data
    depends_on:
      - postgres
      - mysql
      - mongodb
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: migration_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  migrator_data:
  postgres_data:
  mysql_data:
  mongodb_data:
